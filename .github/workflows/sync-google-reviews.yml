name: Sync Google Reviews 5 Stars

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run sync:reviews
        env:
          GOOGLE_DATA_ID: '0xa0afd2dee5e55f:0xfe593c3b98ec5bdb'
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          OUTSCRAPER_API_KEY: ${{ secrets.OUTSCRAPER_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          SITE_DOMAIN: 'newstelagualbertodoceria.pages.dev'
          SITE_PHONE_DIGITS: '5537999232526'
          SITE_CITY: 'Divinópolis'
          SITE_NAME_TOKEN: 'Stela Gualberto'
